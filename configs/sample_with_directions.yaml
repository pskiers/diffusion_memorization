defaults:
  - _self_

out_dir: ./outputs
name: sdxl-with-interventions-monster
seed: 0

model:
  model_class: local_sdxl_pipeline.LocalStableDiffusionXLPipeline
  model_id: stabilityai/stable-diffusion-xl-base-1.0 # stabilityai/sdxl-turbo
  lora_path: null # ../diffusers/examples/dreambooth/lora-trained-xl-prior_preservation/pytorch_lora_weights.safetensors
  device_map: null
  num_inference_steps: 50
call_kwargs:
  width: 1024
  height: 1024
  num_inference_steps: 50
  guidance_scale: 7.5

prompt: "A picture of a monster"
token: "monster"
min_intervention_strenght: 25
max_intervention_strenght: 45

batch_size: 5
num_samples: 10000
directions_path: "../universal-diffsae/sae-ckpts/monster-k32-exp-factor-8_grads"
direction_type: "sae"

