defaults:
  - attribution_method: flipd
  - _self_

out_dir: ./outputs
name: sdxl_dreambooth_dog
seed: 0

lora_path: ../diffusers/examples/dreambooth/lora-trained-xl/pytorch_lora_weights.safetensors

model:
  model_class: local_sdxl_pipeline.LocalStableDiffusionXLPipeline
  model_id: stabilityai/stable-diffusion-xl-base-1.0
  guidance_scale: 7.5
  image_size: 512
  device_map:
    # text encoder
    "text_model": 3

    # VAE
    "encoder": 3
    "decoder": 3
    "quant_conv": 3
    "post_quant_conv": 3

    # UNet
    "text_projection": 0
    "add_embedding": 0
    "time_embedding": 0

    "conv_in": 0

    "down_blocks": 1
    "mid_block": 0
    "up_blocks": 2

    "conv_norm_out": 0
    "conv_out": 0

# the captions to be considered
mem_captions_path: ./match_verbatim_captions.json
prompt_start_idx: 0
prompt_end_idx: 250 # no limits
