defaults:
  - _self_

out_dir: ./outputs
name: sdxl-frog-pca
seed: 0

lora_path: null # ../diffusers/examples/dreambooth/lora-trained-xl-prior_preservation/pytorch_lora_weights.safetensors

model:
  model_class: local_sdxl_pipeline.LocalStableDiffusionXLPipeline
  model_id: stabilityai/stable-diffusion-xl-base-1.0 # stabilityai/sdxl-turbo
  width: 1024
  height: 1024
  num_inference_steps: 50
  guidance_scale: 7.5
  device_map:
    # text encoder
    "text_model": 3

    # VAE
    "encoder": 3
    "decoder": 3
    "quant_conv": 3
    "post_quant_conv": 3

    # UNet
    "text_projection": 0
    "add_embedding": 0
    "time_embedding": 0

    "conv_in": 0

    "down_blocks": 1
    "mid_block": 0
    "up_blocks.0": 2
    "up_blocks.1": 0
    "up_blocks.2": 3
    "up_blocks.3": 2

    "conv_norm_out": 0
    "conv_out": 0
data:
  prompt: "A photograph of the inside of a subway train. There are frogs sitting on the seats. One of them is reading a newspaper. The window shows the river in the background."
  token: "frogs"
  timesteps: [50]
  image_folder: /net/scratch/hscra/plgrid/plgpawel269/LID-project/data/sdxl_subspace_tokens/frog

method: "latent"
remove_common: true
remove_significant_directions: false
randomize_pairs: false
max_pairs: 30000
shard_size: 2000
batch_size: 16
